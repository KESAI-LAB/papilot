<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 672" role="img" aria-labelledby="title desc"><title id="title">Três fluxos de LaTeX lado a lado</title><desc id="desc">Comparação entre Overleaf no navegador, um IDE local com agente de IA e o Papilot focado no PDF com sincronização Overleaf.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"/></marker></defs><g font-family="'Paper Serif','TeX Gyre Pagella',Palatino,'Songti SC','Noto Serif CJK SC',SimSun,serif"><text x="200" y="35" font-size="20" fill="var(--art-ink, #171717)" text-anchor="middle">Três fluxos de LaTeX lado a lado</text><rect x="24" y="62" width="352" height="166" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="39" y="87" font-size="13" fill="var(--art-muted, #525252)" >01 / Navegador</text><text x="39" y="115" font-size="19" fill="var(--art-ink, #171717)" >Overleaf</text><path d="M39 129h322" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="39" y="156" font-size="14.5" fill="var(--art-ink, #171717)" >· Tela dividida .tex/PDF</text><text x="39" y="183" font-size="14.5" fill="var(--art-ink, #171717)" >· Coautoria sem instalar</text><text x="39" y="210" font-size="14.5" fill="var(--art-muted, #525252)" >· Revisão manual do .tex</text><rect x="24" y="246" width="352" height="166" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="39" y="271" font-size="13" fill="var(--art-muted, #525252)" >02 / IDE código</text><text x="39" y="299" font-size="19" fill="var(--art-ink, #171717)" >IDE + Agente</text><path d="M39 313h322" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="39" y="340" font-size="14.5" fill="var(--art-ink, #171717)" >· Git local e CLI</text><text x="39" y="367" font-size="14.5" fill="var(--art-ink, #171717)" >· Prompts no código .tex</text><text x="39" y="394" font-size="14.5" fill="var(--art-muted, #525252)" >· Patches git diff brutos</text><rect x="24" y="430" width="352" height="166" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-accent, #2563eb)"/><text x="39" y="455" font-size="13" fill="var(--art-muted, #525252)" >03 / PDF primeiro</text><text x="39" y="483" font-size="19" fill="var(--art-ink, #171717)" >Papilot</text><path d="M39 497h322" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="39" y="524" font-size="14.5" fill="var(--art-ink, #171717)" >· Anotar direto no PDF</text><text x="39" y="551" font-size="14.5" fill="var(--art-ink, #171717)" >· Diffs PDF diagramados</text><text x="39" y="578" font-size="14.5" fill="var(--art-accent, #2563eb)" >· Sync vivo com Overleaf</text><text x="200" y="644" font-size="14" fill="var(--art-muted, #525252)" text-anchor="middle">Sincronização Overleaf (~1 s) web e PDF</text></g></svg>
