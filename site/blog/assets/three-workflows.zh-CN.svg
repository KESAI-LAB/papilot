<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 416" role="img" aria-labelledby="title desc"><title id="title">三种 LaTeX 写作工作流对比</title><desc id="desc">并排对比 Overleaf 网页端、接入智能体的本地源码 IDE，以及支持与 Overleaf 实时同步的 Papilot 成稿工作区。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"/></marker></defs><g font-family="'Paper Serif','TeX Gyre Pagella',Palatino,'Songti SC','Noto Serif CJK SC',SimSun,serif"><text x="380" y="35" font-size="24" fill="var(--art-ink, #171717)" text-anchor="middle">三种 LaTeX 写作工作流对比</text><rect x="20" y="68" width="228" height="236" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="35" y="93" font-size="13" fill="var(--art-muted, #525252)" >01 / 网页分屏</text><text x="35" y="121" font-size="18.5" fill="var(--art-ink, #171717)" >Overleaf</text><path d="M35 135h198" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="35" y="166" font-size="13.5" fill="var(--art-ink, #171717)" >· 左源码、右预览</text><text x="35" y="200" font-size="13.5" fill="var(--art-ink, #171717)" >· 零配置多人在线协作</text><text x="35" y="234" font-size="13.5" fill="var(--art-muted, #525252)" >· 需人工比对源码改动</text><rect x="266" y="68" width="228" height="236" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="281" y="93" font-size="13" fill="var(--art-muted, #525252)" >02 / 源码 IDE</text><text x="281" y="121" font-size="18.5" fill="var(--art-ink, #171717)" >IDE + 智能体</text><path d="M281 135h198" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="281" y="166" font-size="13.5" fill="var(--art-ink, #171717)" >· 本地 Git 与命令行</text><text x="281" y="200" font-size="13.5" fill="var(--art-ink, #171717)" >· 在 .tex 代码里提问</text><text x="281" y="234" font-size="13.5" fill="var(--art-muted, #525252)" >· 审阅红绿源码 diff</text><rect x="512" y="68" width="228" height="236" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-accent, #2563eb)"/><text x="527" y="93" font-size="13" fill="var(--art-muted, #525252)" >03 / 成稿优先</text><text x="527" y="121" font-size="18.5" fill="var(--art-ink, #171717)" >Papilot</text><path d="M527 135h198" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="527" y="166" font-size="13.5" fill="var(--art-ink, #171717)" >· 直接在 PDF 上批注</text><text x="527" y="200" font-size="13.5" fill="var(--art-ink, #171717)" >· 原位审阅排版级对比</text><text x="527" y="234" font-size="13.5" fill="var(--art-accent, #2563eb)" >· 约 1 秒同步 Overleaf</text><path d="M134 316v26h492v-26" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4" stroke-dasharray="4 4" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="380" y="378" font-size="15" fill="var(--art-muted, #525252)" text-anchor="middle">Overleaf 实时同步（约 1 秒）连接网页与本地手稿</text></g></svg>
