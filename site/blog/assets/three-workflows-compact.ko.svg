<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 672" role="img" aria-labelledby="title desc"><title id="title">세 가지 LaTeX 집필 워크플로</title><desc id="desc">브라우저 기반 Overleaf, 코딩 에이전트를 결합한 소스 IDE, 실시간 Overleaf 동기화를 지원하는 PDF 중심 Papilot을 비교합니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"/></marker></defs><g font-family="'Paper Serif','TeX Gyre Pagella',Palatino,'Songti SC','Noto Serif CJK SC',SimSun,serif"><text x="200" y="35" font-size="20" fill="var(--art-ink, #171717)" text-anchor="middle">세 가지 LaTeX 집필 워크플로</text><rect x="24" y="62" width="352" height="166" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="39" y="87" font-size="13" fill="var(--art-muted, #525252)" >01 / 브라우저</text><text x="39" y="115" font-size="19" fill="var(--art-ink, #171717)" >Overleaf</text><path d="M39 129h322" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="39" y="156" font-size="14.5" fill="var(--art-ink, #171717)" >· .tex 및 PDF 분할 화면</text><text x="39" y="183" font-size="14.5" fill="var(--art-ink, #171717)" >· 설치 없는 실시간 협업</text><text x="39" y="210" font-size="14.5" fill="var(--art-muted, #525252)" >· 수동 소스 변경 확인</text><rect x="24" y="246" width="352" height="166" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="39" y="271" font-size="13" fill="var(--art-muted, #525252)" >02 / 소스 IDE</text><text x="39" y="299" font-size="19" fill="var(--art-ink, #171717)" >IDE + AI</text><path d="M39 313h322" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="39" y="340" font-size="14.5" fill="var(--art-ink, #171717)" >· 로컬 Git 및 CLI 도구</text><text x="39" y="367" font-size="14.5" fill="var(--art-ink, #171717)" >· .tex 코드에서 프롬프트</text><text x="39" y="394" font-size="14.5" fill="var(--art-muted, #525252)" >· 원시 git diff 패치</text><rect x="24" y="430" width="352" height="166" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-accent, #2563eb)"/><text x="39" y="455" font-size="13" fill="var(--art-muted, #525252)" >03 / PDF 중심</text><text x="39" y="483" font-size="19" fill="var(--art-ink, #171717)" >Papilot</text><path d="M39 497h322" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="39" y="524" font-size="14.5" fill="var(--art-ink, #171717)" >· PDF 위에 직접 주석</text><text x="39" y="551" font-size="14.5" fill="var(--art-ink, #171717)" >· 조판된 PDF 비교 검토</text><text x="39" y="578" font-size="14.5" fill="var(--art-accent, #2563eb)" >· 실시간 Overleaf 동기화</text><text x="200" y="644" font-size="14" fill="var(--art-muted, #525252)" text-anchor="middle">Overleaf 실시간 동기화(~1초)로 공저자 연결</text></g></svg>
