<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 668" role="img" aria-labelledby="title desc"><title id="title">증분 조판 검토 파이프라인</title><desc id="desc">Papilot이 Git 워크트리에 태스크 스냅샷을 찍고, 웜 LaTeX 상태에서 두 버전을 빌드하며, 조판된 문서를 비교하고 각 결정을 기록하는 과정.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"/></marker></defs><g font-family="'Paper Serif','TeX Gyre Pagella',Palatino,'Songti SC','Noto Serif CJK SC',SimSun,serif"><text x="200" y="36" font-size="20" fill="var(--art-ink, #171717)" text-anchor="middle">증분 조판 검토 파이프라인</text><rect x="34" y="68" width="332" height="113" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="53" y="95" font-size="13.5" fill="var(--art-muted, #525252)" >01  /  Git 워크트리</text><text x="53" y="126" font-size="19.5" fill="var(--art-ink, #171717)" >작업 수정 격리</text><text x="53" y="157" font-size="14.5" fill="var(--art-muted, #525252)" >전용 Git 증분 스냅샷 인덱스.</text><path d="M200 193v18" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="34" y="212" width="332" height="113" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="53" y="239" font-size="13.5" fill="var(--art-muted, #525252)" >02  /  시드 빌드</text><text x="53" y="270" font-size="19.5" fill="var(--art-ink, #171717)" >복제 및 컴파일</text><text x="53" y="301" font-size="14.5" fill="var(--art-muted, #525252)" >웜 상태, 양쪽 동시 빌드.</text><path d="M200 337v18" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="34" y="356" width="332" height="113" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-accent, #2563eb)"/><text x="53" y="383" font-size="13.5" fill="var(--art-muted, #525252)" >03  /  비교 엔진</text><text x="53" y="414" font-size="19.5" fill="var(--art-ink, #171717)" >조판 전후 비교</text><text x="53" y="445" font-size="14.5" fill="var(--art-muted, #525252)" >본문 오프셋과 수식 보존.</text><path d="M200 481v18" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="34" y="500" width="332" height="113" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-accent, #2563eb)"/><text x="53" y="527" font-size="13.5" fill="var(--art-muted, #525252)" >04  /  검토 저널</text><text x="53" y="558" font-size="19.5" fill="var(--art-ink, #171717)" >주석별 수락 결정</text><text x="53" y="589" font-size="14.5" fill="var(--art-muted, #525252)" >적용 전까지 원본을 보호.</text><text x="200" y="650" font-size="14" fill="var(--art-muted, #525252)" text-anchor="middle">적용·커밋 전까지 작업 폴더는 그대로 유지.</text></g></svg>
