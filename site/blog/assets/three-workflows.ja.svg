<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 416" role="img" aria-labelledby="title desc"><title id="title">3つの LaTeX 執筆ワークフロー</title><desc id="desc">ブラウザの Overleaf、AI エージェント付きソース IDE、Overleaf リアルタイム同期を備えた PDF 中心の Papilot を比較します。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"/></marker></defs><g font-family="'Paper Serif','TeX Gyre Pagella',Palatino,'Songti SC','Noto Serif CJK SC',SimSun,serif"><text x="380" y="35" font-size="24" fill="var(--art-ink, #171717)" text-anchor="middle">3つの LaTeX 執筆ワークフロー</text><rect x="20" y="68" width="228" height="236" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="35" y="93" font-size="13" fill="var(--art-muted, #525252)" >01 / ブラウザ</text><text x="35" y="121" font-size="18.5" fill="var(--art-ink, #171717)" >Overleaf</text><path d="M35 135h198" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="35" y="166" font-size="13.5" fill="var(--art-ink, #171717)" >· ソースと PDF の分割</text><text x="35" y="200" font-size="13.5" fill="var(--art-ink, #171717)" >· 環境構築不要の共同編集</text><text x="35" y="234" font-size="13.5" fill="var(--art-muted, #525252)" >· ソース変更を手動確認</text><rect x="266" y="68" width="228" height="236" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="281" y="93" font-size="13" fill="var(--art-muted, #525252)" >02 / ソース IDE</text><text x="281" y="121" font-size="18.5" fill="var(--art-ink, #171717)" >IDE + AI</text><path d="M281 135h198" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="281" y="166" font-size="13.5" fill="var(--art-ink, #171717)" >· ローカル Git と CLI</text><text x="281" y="200" font-size="13.5" fill="var(--art-ink, #171717)" >· .tex コード上で指示</text><text x="281" y="234" font-size="13.5" fill="var(--art-muted, #525252)" >· 生の git diff を確認</text><rect x="512" y="68" width="228" height="236" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-accent, #2563eb)"/><text x="527" y="93" font-size="13" fill="var(--art-muted, #525252)" >03 / PDF 中心</text><text x="527" y="121" font-size="18.5" fill="var(--art-ink, #171717)" >Papilot</text><path d="M527 135h198" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="527" y="166" font-size="13.5" fill="var(--art-ink, #171717)" >· PDF 上に直接注釈</text><text x="527" y="200" font-size="13.5" fill="var(--art-ink, #171717)" >· 組版済み PDF 差分確認</text><text x="527" y="234" font-size="13.5" fill="var(--art-accent, #2563eb)" >· Overleaf と即時同期</text><path d="M134 316v26h492v-26" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4" stroke-dasharray="4 4" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="380" y="378" font-size="15" fill="var(--art-muted, #525252)" text-anchor="middle">Overleaf 即時同期（約1秒）で共著者と連携</text></g></svg>
