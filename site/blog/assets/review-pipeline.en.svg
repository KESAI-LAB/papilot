<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 448" role="img" aria-labelledby="title desc"><title id="title">Incremental typeset review pipeline</title><desc id="desc">How Papilot snapshots a task in a Git worktree, builds both versions from warm LaTeX state, compares the typeset documents and records each decision.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"/></marker></defs><g font-family="'Paper Serif','TeX Gyre Pagella',Palatino,'Songti SC','Noto Serif CJK SC',SimSun,serif"><text x="380" y="36" font-size="24" fill="var(--art-ink, #171717)" text-anchor="middle">Incremental typeset review pipeline</text><rect x="30" y="73" width="300" height="124" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="49" y="100" font-size="13.5" fill="var(--art-muted, #525252)" >01  /  Git worktree</text><text x="49" y="131" font-size="20.5" fill="var(--art-ink, #171717)" >Isolate the task</text><text x="49" y="162" font-size="15.5" fill="var(--art-muted, #525252)" >Private Git snapshot index.</text><rect x="430" y="73" width="300" height="124" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="449" y="100" font-size="13.5" fill="var(--art-muted, #525252)" >02  /  Seeded build</text><text x="449" y="131" font-size="20.5" fill="var(--art-ink, #171717)" >Clone &amp; compile</text><text x="449" y="162" font-size="15.5" fill="var(--art-muted, #525252)" >Warm state, both sides at once.</text><rect x="30" y="273" width="300" height="124" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-accent, #2563eb)"/><text x="49" y="300" font-size="13.5" fill="var(--art-muted, #525252)" >03  /  Diff engine</text><text x="49" y="331" font-size="20.5" fill="var(--art-ink, #171717)" >Typeset comparison</text><text x="49" y="362" font-size="15.5" fill="var(--art-muted, #525252)" >Fine prose &amp; atomic math.</text><rect x="430" y="273" width="300" height="124" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-accent, #2563eb)"/><text x="449" y="300" font-size="13.5" fill="var(--art-muted, #525252)" >04  /  Review journal</text><text x="449" y="331" font-size="20.5" fill="var(--art-ink, #171717)" >Decide per note</text><text x="449" y="362" font-size="15.5" fill="var(--art-muted, #525252)" >Undoable until you Apply.</text><path d="M344 135h72" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M580 209v26H180v24" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M344 335h72" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"  marker-end="url(#arrow)"/><text x="380" y="434" font-size="15.5" fill="var(--art-muted, #525252)" text-anchor="middle">Working tree stays untouched until Apply.</text></g></svg>
