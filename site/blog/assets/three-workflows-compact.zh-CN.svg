<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 672" role="img" aria-labelledby="title desc"><title id="title">三种 LaTeX 写作工作流对比</title><desc id="desc">并排对比 Overleaf 网页端、接入智能体的本地源码 IDE，以及支持与 Overleaf 实时同步的 Papilot 成稿工作区。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"/></marker></defs><g font-family="'Paper Serif','TeX Gyre Pagella',Palatino,'Songti SC','Noto Serif CJK SC',SimSun,serif"><text x="200" y="35" font-size="20" fill="var(--art-ink, #171717)" text-anchor="middle">三种 LaTeX 写作工作流对比</text><rect x="24" y="62" width="352" height="166" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="39" y="87" font-size="13" fill="var(--art-muted, #525252)" >01 / 网页分屏</text><text x="39" y="115" font-size="19" fill="var(--art-ink, #171717)" >Overleaf</text><path d="M39 129h322" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="39" y="156" font-size="14.5" fill="var(--art-ink, #171717)" >· 左源码、右预览</text><text x="39" y="183" font-size="14.5" fill="var(--art-ink, #171717)" >· 零配置多人在线协作</text><text x="39" y="210" font-size="14.5" fill="var(--art-muted, #525252)" >· 需人工比对源码改动</text><rect x="24" y="246" width="352" height="166" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="39" y="271" font-size="13" fill="var(--art-muted, #525252)" >02 / 源码 IDE</text><text x="39" y="299" font-size="19" fill="var(--art-ink, #171717)" >IDE + 智能体</text><path d="M39 313h322" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="39" y="340" font-size="14.5" fill="var(--art-ink, #171717)" >· 本地 Git 与命令行</text><text x="39" y="367" font-size="14.5" fill="var(--art-ink, #171717)" >· 在 .tex 代码里提问</text><text x="39" y="394" font-size="14.5" fill="var(--art-muted, #525252)" >· 审阅红绿源码 diff</text><rect x="24" y="430" width="352" height="166" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-accent, #2563eb)"/><text x="39" y="455" font-size="13" fill="var(--art-muted, #525252)" >03 / 成稿优先</text><text x="39" y="483" font-size="19" fill="var(--art-ink, #171717)" >Papilot</text><path d="M39 497h322" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="39" y="524" font-size="14.5" fill="var(--art-ink, #171717)" >· 直接在 PDF 上批注</text><text x="39" y="551" font-size="14.5" fill="var(--art-ink, #171717)" >· 原位审阅排版级对比</text><text x="39" y="578" font-size="14.5" fill="var(--art-accent, #2563eb)" >· 约 1 秒同步 Overleaf</text><text x="200" y="644" font-size="14" fill="var(--art-muted, #525252)" text-anchor="middle">Overleaf 实时同步（约 1 秒）连接网页与本地手稿</text></g></svg>
