<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 448" role="img" aria-labelledby="title desc"><title id="title">增量编译与排版审阅流水线</title><desc id="desc">Papilot 在独立 Git 工作树中隔离修改，并行增量编译变动章节，完成排版级差异归属与可撤销审阅日志。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"/></marker></defs><g font-family="'Paper Serif','TeX Gyre Pagella',Palatino,'Songti SC','Noto Serif CJK SC',SimSun,serif"><text x="380" y="36" font-size="24" fill="var(--art-ink, #171717)" text-anchor="middle">增量编译与排版审阅流水线</text><rect x="30" y="73" width="300" height="124" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="49" y="100" font-size="13.5" fill="var(--art-muted, #525252)" >01  /  Git 工作树</text><text x="49" y="131" font-size="20.5" fill="var(--art-ink, #171717)" >隔离任务修改</text><text x="49" y="162" font-size="15.5" fill="var(--art-muted, #525252)" >私有 Git 增量快照索引。</text><rect x="430" y="73" width="300" height="124" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="449" y="100" font-size="13.5" fill="var(--art-muted, #525252)" >02  /  种子增量构建</text><text x="449" y="131" font-size="20.5" fill="var(--art-ink, #171717)" >克隆并编译</text><text x="449" y="162" font-size="15.5" fill="var(--art-muted, #525252)" >变动章节并行增量构建。</text><rect x="30" y="273" width="300" height="124" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-accent, #2563eb)"/><text x="49" y="300" font-size="13.5" fill="var(--art-muted, #525252)" >03  /  差异归属引擎</text><text x="49" y="331" font-size="20.5" fill="var(--art-ink, #171717)" >生成版面对比</text><text x="49" y="362" font-size="15.5" fill="var(--art-muted, #525252)" >正文偏移与原子公式保护。</text><rect x="430" y="273" width="300" height="124" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-accent, #2563eb)"/><text x="449" y="300" font-size="13.5" fill="var(--art-muted, #525252)" >04  /  可撤销日志</text><text x="449" y="331" font-size="20.5" fill="var(--art-ink, #171717)" >逐条拍板决定</text><text x="449" y="362" font-size="15.5" fill="var(--art-muted, #525252)" >点击应用前绝不改动原稿。</text><path d="M344 135h72" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M580 209v26H180v24" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M344 335h72" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"  marker-end="url(#arrow)"/><text x="380" y="434" font-size="15.5" fill="var(--art-muted, #525252)" text-anchor="middle">点击应用或提交前，主工作目录保持原样。</text></g></svg>
