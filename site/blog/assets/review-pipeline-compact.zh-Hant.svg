<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 668" role="img" aria-labelledby="title desc"><title id="title">增量編譯與排版審閱管線</title><desc id="desc">Papilot 如何在 Git 工作樹中為任務建立快照、從預熱的 LaTeX 狀態建置新舊版本、比對排版後的文件並記錄每項決定。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"/></marker></defs><g font-family="'Paper Serif','TeX Gyre Pagella',Palatino,'Songti SC','Noto Serif CJK SC',SimSun,serif"><text x="200" y="36" font-size="20" fill="var(--art-ink, #171717)" text-anchor="middle">增量編譯與排版審閱管線</text><rect x="34" y="68" width="332" height="113" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="53" y="95" font-size="13.5" fill="var(--art-muted, #525252)" >01  /  Git 工作樹</text><text x="53" y="126" font-size="19.5" fill="var(--art-ink, #171717)" >隔離任務修改</text><text x="53" y="157" font-size="14.5" fill="var(--art-muted, #525252)" >私有 Git 增量快照索引。</text><path d="M200 193v18" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="34" y="212" width="332" height="113" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="53" y="239" font-size="13.5" fill="var(--art-muted, #525252)" >02  /  種子增量建置</text><text x="53" y="270" font-size="19.5" fill="var(--art-ink, #171717)" >複製並編譯</text><text x="53" y="301" font-size="14.5" fill="var(--art-muted, #525252)" >預熱狀態，雙邊同步建置。</text><path d="M200 337v18" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="34" y="356" width="332" height="113" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-accent, #2563eb)"/><text x="53" y="383" font-size="13.5" fill="var(--art-muted, #525252)" >03  /  差異歸屬引擎</text><text x="53" y="414" font-size="19.5" fill="var(--art-ink, #171717)" >產生版面對比</text><text x="53" y="445" font-size="14.5" fill="var(--art-muted, #525252)" >內文偏移與原子公式保護。</text><path d="M200 481v18" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="34" y="500" width="332" height="113" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-accent, #2563eb)"/><text x="53" y="527" font-size="13.5" fill="var(--art-muted, #525252)" >04  /  可復原日誌</text><text x="53" y="558" font-size="19.5" fill="var(--art-ink, #171717)" >逐條拍板決定</text><text x="53" y="589" font-size="14.5" fill="var(--art-muted, #525252)" >套用前絕不改動主目錄。</text><text x="200" y="650" font-size="14" fill="var(--art-muted, #525252)" text-anchor="middle">點擊套用或提交前，主工作目錄保持原樣。</text></g></svg>
