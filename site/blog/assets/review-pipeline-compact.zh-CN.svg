<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 668" role="img" aria-labelledby="title desc"><title id="title">增量编译与排版审阅流水线</title><desc id="desc">Papilot 如何在 Git 工作树中为任务创建快照、基于热缓存 LaTeX 状态编译两个版本、比对排版后的文档并记录每项决定。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"/></marker></defs><g font-family="'Paper Serif','TeX Gyre Pagella',Palatino,'Songti SC','Noto Serif CJK SC',SimSun,serif"><text x="200" y="36" font-size="20" fill="var(--art-ink, #171717)" text-anchor="middle">增量编译与排版审阅流水线</text><rect x="34" y="68" width="332" height="113" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="53" y="95" font-size="13.5" fill="var(--art-muted, #525252)" >01  /  Git 工作树</text><text x="53" y="126" font-size="19.5" fill="var(--art-ink, #171717)" >隔离任务修改</text><text x="53" y="157" font-size="14.5" fill="var(--art-muted, #525252)" >私有 Git 增量快照索引。</text><path d="M200 193v18" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="34" y="212" width="332" height="113" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="53" y="239" font-size="13.5" fill="var(--art-muted, #525252)" >02  /  种子增量构建</text><text x="53" y="270" font-size="19.5" fill="var(--art-ink, #171717)" >克隆并编译</text><text x="53" y="301" font-size="14.5" fill="var(--art-muted, #525252)" >热缓存状态，双侧同时编译。</text><path d="M200 337v18" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="34" y="356" width="332" height="113" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-accent, #2563eb)"/><text x="53" y="383" font-size="13.5" fill="var(--art-muted, #525252)" >03  /  差异归属引擎</text><text x="53" y="414" font-size="19.5" fill="var(--art-ink, #171717)" >生成版面对比</text><text x="53" y="445" font-size="14.5" fill="var(--art-muted, #525252)" >正文偏移与原子公式保护。</text><path d="M200 481v18" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="34" y="500" width="332" height="113" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-accent, #2563eb)"/><text x="53" y="527" font-size="13.5" fill="var(--art-muted, #525252)" >04  /  可撤销日志</text><text x="53" y="558" font-size="19.5" fill="var(--art-ink, #171717)" >逐条拍板决定</text><text x="53" y="589" font-size="14.5" fill="var(--art-muted, #525252)" >点击应用前绝不改动原稿。</text><text x="200" y="650" font-size="14" fill="var(--art-muted, #525252)" text-anchor="middle">点击应用或提交前，主工作目录保持原样。</text></g></svg>
