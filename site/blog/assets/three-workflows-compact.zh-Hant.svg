<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 672" role="img" aria-labelledby="title desc"><title id="title">三種 LaTeX 寫作工作流對比</title><desc id="desc">並排對比 Overleaf 網頁端、接入代理的本機原始碼 IDE，以及支援與 Overleaf 即時同步的 Papilot 成稿工作區。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"/></marker></defs><g font-family="'Paper Serif','TeX Gyre Pagella',Palatino,'Songti SC','Noto Serif CJK SC',SimSun,serif"><text x="200" y="35" font-size="20" fill="var(--art-ink, #171717)" text-anchor="middle">三種 LaTeX 寫作工作流對比</text><rect x="24" y="62" width="352" height="166" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="39" y="87" font-size="13" fill="var(--art-muted, #525252)" >01 / 網頁分屏</text><text x="39" y="115" font-size="19" fill="var(--art-ink, #171717)" >Overleaf</text><path d="M39 129h322" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="39" y="156" font-size="14.5" fill="var(--art-ink, #171717)" >· 左原始碼、右預覽</text><text x="39" y="183" font-size="14.5" fill="var(--art-ink, #171717)" >· 免設定多人線上協作</text><text x="39" y="210" font-size="14.5" fill="var(--art-muted, #525252)" >· 需人工比對原始碼改動</text><rect x="24" y="246" width="352" height="166" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="39" y="271" font-size="13" fill="var(--art-muted, #525252)" >02 / 原始碼 IDE</text><text x="39" y="299" font-size="19" fill="var(--art-ink, #171717)" >IDE + 代理</text><path d="M39 313h322" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="39" y="340" font-size="14.5" fill="var(--art-ink, #171717)" >· 本機 Git 與命令列</text><text x="39" y="367" font-size="14.5" fill="var(--art-ink, #171717)" >· 在 .tex 程式碼發問</text><text x="39" y="394" font-size="14.5" fill="var(--art-muted, #525252)" >· 審閱紅綠原始碼 diff</text><rect x="24" y="430" width="352" height="166" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-accent, #2563eb)"/><text x="39" y="455" font-size="13" fill="var(--art-muted, #525252)" >03 / 成稿優先</text><text x="39" y="483" font-size="19" fill="var(--art-ink, #171717)" >Papilot</text><path d="M39 497h322" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="39" y="524" font-size="14.5" fill="var(--art-ink, #171717)" >· 直接在 PDF 上批註</text><text x="39" y="551" font-size="14.5" fill="var(--art-ink, #171717)" >· 原位審閱排版級對比</text><text x="39" y="578" font-size="14.5" fill="var(--art-accent, #2563eb)" >· 約 1 秒同步 Overleaf</text><text x="200" y="644" font-size="14" fill="var(--art-muted, #525252)" text-anchor="middle">Overleaf 即時同步（約 1 秒）連結網頁與本機手稿</text></g></svg>
