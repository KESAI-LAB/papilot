<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 668" role="img" aria-labelledby="title desc"><title id="title">Pipeline incremental de revisión</title><desc id="desc">Papilot aísla cambios en un worktree Git, compila capítulos en paralelo y guarda decisiones reversibles antes de aplicar.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"/></marker></defs><g font-family="'Paper Serif','TeX Gyre Pagella',Palatino,'Songti SC','Noto Serif CJK SC',SimSun,serif"><text x="200" y="36" font-size="20" fill="var(--art-ink, #171717)" text-anchor="middle">Pipeline incremental de revisión</text><rect x="34" y="68" width="332" height="113" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="53" y="95" font-size="13.5" fill="var(--art-muted, #525252)" >01  /  Worktree Git</text><text x="53" y="126" font-size="19.5" fill="var(--art-ink, #171717)" >Aislar la tarea</text><text x="53" y="157" font-size="14.5" fill="var(--art-muted, #525252)" >Índice Git privado incremental.</text><path d="M200 193v18" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="34" y="212" width="332" height="113" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="53" y="239" font-size="13.5" fill="var(--art-muted, #525252)" >02  /  Build semilla</text><text x="53" y="270" font-size="19.5" fill="var(--art-ink, #171717)" >Clonar y compilar</text><text x="53" y="301" font-size="14.5" fill="var(--art-muted, #525252)" >Capítulos en paralelo.</text><path d="M200 337v18" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="34" y="356" width="332" height="113" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-accent, #2563eb)"/><text x="53" y="383" font-size="13.5" fill="var(--art-muted, #525252)" >03  /  Motor diff</text><text x="53" y="414" font-size="19.5" fill="var(--art-ink, #171717)" >Comparación PDF</text><text x="53" y="445" font-size="14.5" fill="var(--art-muted, #525252)" >Prosa fina y mates íntegras.</text><path d="M200 481v18" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="34" y="500" width="332" height="113" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-accent, #2563eb)"/><text x="53" y="527" font-size="13.5" fill="var(--art-muted, #525252)" >04  /  Registro</text><text x="53" y="558" font-size="19.5" fill="var(--art-ink, #171717)" >Decidir por nota</text><text x="53" y="589" font-size="14.5" fill="var(--art-muted, #525252)" >Reversible hasta Aplicar.</text><text x="200" y="650" font-size="14" fill="var(--art-muted, #525252)" text-anchor="middle">Tu carpeta no cambia hasta pulsar Aplicar.</text></g></svg>
