<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 416" role="img" aria-labelledby="title desc"><title id="title">三種 LaTeX 寫作工作流對比</title><desc id="desc">並排對比 Overleaf 網頁端、接入代理的本機原始碼 IDE，以及支援與 Overleaf 即時同步的 Papilot 成稿工作區。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"/></marker></defs><g font-family="'Paper Serif','TeX Gyre Pagella',Palatino,'Songti SC','Noto Serif CJK SC',SimSun,serif"><text x="380" y="35" font-size="24" fill="var(--art-ink, #171717)" text-anchor="middle">三種 LaTeX 寫作工作流對比</text><rect x="20" y="68" width="228" height="236" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="35" y="93" font-size="13" fill="var(--art-muted, #525252)" >01 / 網頁分屏</text><text x="35" y="121" font-size="18.5" fill="var(--art-ink, #171717)" >Overleaf</text><path d="M35 135h198" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="35" y="166" font-size="13.5" fill="var(--art-ink, #171717)" >· 左原始碼、右預覽</text><text x="35" y="200" font-size="13.5" fill="var(--art-ink, #171717)" >· 免設定多人線上協作</text><text x="35" y="234" font-size="13.5" fill="var(--art-muted, #525252)" >· 需人工比對原始碼改動</text><rect x="266" y="68" width="228" height="236" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="281" y="93" font-size="13" fill="var(--art-muted, #525252)" >02 / 原始碼 IDE</text><text x="281" y="121" font-size="18.5" fill="var(--art-ink, #171717)" >IDE + 代理</text><path d="M281 135h198" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="281" y="166" font-size="13.5" fill="var(--art-ink, #171717)" >· 本機 Git 與命令列</text><text x="281" y="200" font-size="13.5" fill="var(--art-ink, #171717)" >· 在 .tex 程式碼發問</text><text x="281" y="234" font-size="13.5" fill="var(--art-muted, #525252)" >· 審閱紅綠原始碼 diff</text><rect x="512" y="68" width="228" height="236" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-accent, #2563eb)"/><text x="527" y="93" font-size="13" fill="var(--art-muted, #525252)" >03 / 成稿優先</text><text x="527" y="121" font-size="18.5" fill="var(--art-ink, #171717)" >Papilot</text><path d="M527 135h198" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="527" y="166" font-size="13.5" fill="var(--art-ink, #171717)" >· 直接在 PDF 上批註</text><text x="527" y="200" font-size="13.5" fill="var(--art-ink, #171717)" >· 原位審閱排版級對比</text><text x="527" y="234" font-size="13.5" fill="var(--art-accent, #2563eb)" >· 約 1 秒同步 Overleaf</text><path d="M134 316v26h492v-26" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4" stroke-dasharray="4 4" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="380" y="378" font-size="15" fill="var(--art-muted, #525252)" text-anchor="middle">Overleaf 即時同步（約 1 秒）連結網頁與本機手稿</text></g></svg>
