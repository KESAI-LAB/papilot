<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 668" role="img" aria-labelledby="title desc"><title id="title">差分コンパイルと組版確認の流れ</title><desc id="desc">Git ワークツリーで編集を隔離し、変更章を並列ビルドして組版差分と取り消し可能な判断履歴を作ります。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"/></marker></defs><g font-family="'Paper Serif','TeX Gyre Pagella',Palatino,'Songti SC','Noto Serif CJK SC',SimSun,serif"><text x="200" y="36" font-size="20" fill="var(--art-ink, #171717)" text-anchor="middle">差分コンパイルと組版確認の流れ</text><rect x="34" y="68" width="332" height="113" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="53" y="95" font-size="13.5" fill="var(--art-muted, #525252)" >01  /  Git ワークツリー</text><text x="53" y="126" font-size="19.5" fill="var(--art-ink, #171717)" >タスクを隔離</text><text x="53" y="157" font-size="14.5" fill="var(--art-muted, #525252)" >専用 Git 差分インデックス。</text><path d="M200 193v18" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="34" y="212" width="332" height="113" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="53" y="239" font-size="13.5" fill="var(--art-muted, #525252)" >02  /  シードビルド</text><text x="53" y="270" font-size="19.5" fill="var(--art-ink, #171717)" >複製と並列構築</text><text x="53" y="301" font-size="14.5" fill="var(--art-muted, #525252)" >変更された章だけを組版。</text><path d="M200 337v18" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="34" y="356" width="332" height="113" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-accent, #2563eb)"/><text x="53" y="383" font-size="13.5" fill="var(--art-muted, #525252)" >03  /  差分エンジン</text><text x="53" y="414" font-size="19.5" fill="var(--art-ink, #171717)" >組版前後の比較</text><text x="53" y="445" font-size="14.5" fill="var(--art-muted, #525252)" >本文位置と数式の保護。</text><path d="M200 481v18" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"  marker-end="url(#arrow)"/><rect x="34" y="500" width="332" height="113" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-accent, #2563eb)"/><text x="53" y="527" font-size="13.5" fill="var(--art-muted, #525252)" >04  /  判断ジャーナル</text><text x="53" y="558" font-size="19.5" fill="var(--art-ink, #171717)" >注釈ごとに判断</text><text x="53" y="589" font-size="14.5" fill="var(--art-muted, #525252)" >適用するまで原稿を保護。</text><text x="200" y="650" font-size="14" fill="var(--art-muted, #525252)" text-anchor="middle">適用・コミットまで作業フォルダは不変。</text></g></svg>
