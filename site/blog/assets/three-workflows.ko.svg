<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 416" role="img" aria-labelledby="title desc"><title id="title">세 가지 LaTeX 집필 워크플로</title><desc id="desc">브라우저 기반 Overleaf, 코딩 에이전트를 결합한 소스 IDE, 실시간 Overleaf 동기화를 지원하는 PDF 중심 Papilot을 비교합니다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"/></marker></defs><g font-family="'Paper Serif','TeX Gyre Pagella',Palatino,'Songti SC','Noto Serif CJK SC',SimSun,serif"><text x="380" y="35" font-size="24" fill="var(--art-ink, #171717)" text-anchor="middle">세 가지 LaTeX 집필 워크플로</text><rect x="20" y="68" width="228" height="236" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="35" y="93" font-size="13" fill="var(--art-muted, #525252)" >01 / 브라우저</text><text x="35" y="121" font-size="18.5" fill="var(--art-ink, #171717)" >Overleaf</text><path d="M35 135h198" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="35" y="166" font-size="13.5" fill="var(--art-ink, #171717)" >· .tex 및 PDF 분할 화면</text><text x="35" y="200" font-size="13.5" fill="var(--art-ink, #171717)" >· 설치 없는 실시간 협업</text><text x="35" y="234" font-size="13.5" fill="var(--art-muted, #525252)" >· 수동 소스 변경 확인</text><rect x="266" y="68" width="228" height="236" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="281" y="93" font-size="13" fill="var(--art-muted, #525252)" >02 / 소스 IDE</text><text x="281" y="121" font-size="18.5" fill="var(--art-ink, #171717)" >IDE + AI</text><path d="M281 135h198" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="281" y="166" font-size="13.5" fill="var(--art-ink, #171717)" >· 로컬 Git 및 CLI 도구</text><text x="281" y="200" font-size="13.5" fill="var(--art-ink, #171717)" >· .tex 코드에서 프롬프트</text><text x="281" y="234" font-size="13.5" fill="var(--art-muted, #525252)" >· 원시 git diff 패치</text><rect x="512" y="68" width="228" height="236" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-accent, #2563eb)"/><text x="527" y="93" font-size="13" fill="var(--art-muted, #525252)" >03 / PDF 중심</text><text x="527" y="121" font-size="18.5" fill="var(--art-ink, #171717)" >Papilot</text><path d="M527 135h198" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="527" y="166" font-size="13.5" fill="var(--art-ink, #171717)" >· PDF 위에 직접 주석</text><text x="527" y="200" font-size="13.5" fill="var(--art-ink, #171717)" >· 조판된 PDF 비교 검토</text><text x="527" y="234" font-size="13.5" fill="var(--art-accent, #2563eb)" >· 실시간 Overleaf 동기화</text><path d="M134 316v26h492v-26" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4" stroke-dasharray="4 4" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="380" y="378" font-size="15" fill="var(--art-muted, #525252)" text-anchor="middle">Overleaf 실시간 동기화(~1초)로 공저자 연결</text></g></svg>
