<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 416" role="img" aria-labelledby="title desc"><title id="title">Tres flujos de LaTeX comparados</title><desc id="desc">Comparación entre Overleaf en navegador, un IDE de código con agente IA y Papilot sobre el PDF con sincronización Overleaf.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"/></marker></defs><g font-family="'Paper Serif','TeX Gyre Pagella',Palatino,'Songti SC','Noto Serif CJK SC',SimSun,serif"><text x="380" y="35" font-size="24" fill="var(--art-ink, #171717)" text-anchor="middle">Tres flujos de LaTeX comparados</text><rect x="20" y="68" width="228" height="236" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="35" y="93" font-size="13" fill="var(--art-muted, #525252)" >01 / Navegador</text><text x="35" y="121" font-size="18.5" fill="var(--art-ink, #171717)" >Overleaf</text><path d="M35 135h198" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="35" y="166" font-size="13.5" fill="var(--art-ink, #171717)" >· Vista dividida .tex/PDF</text><text x="35" y="200" font-size="13.5" fill="var(--art-ink, #171717)" >· Coautoría sin instalar</text><text x="35" y="234" font-size="13.5" fill="var(--art-muted, #525252)" >· Revisión manual de .tex</text><rect x="266" y="68" width="228" height="236" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="281" y="93" font-size="13" fill="var(--art-muted, #525252)" >02 / IDE código</text><text x="281" y="121" font-size="18.5" fill="var(--art-ink, #171717)" >IDE + Agente</text><path d="M281 135h198" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="281" y="166" font-size="13.5" fill="var(--art-ink, #171717)" >· Git local y CLI</text><text x="281" y="200" font-size="13.5" fill="var(--art-ink, #171717)" >· Prompts en archivos .tex</text><text x="281" y="234" font-size="13.5" fill="var(--art-muted, #525252)" >· Parches git diff puros</text><rect x="512" y="68" width="228" height="236" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-accent, #2563eb)"/><text x="527" y="93" font-size="13" fill="var(--art-muted, #525252)" >03 / PDF primero</text><text x="527" y="121" font-size="18.5" fill="var(--art-ink, #171717)" >Papilot</text><path d="M527 135h198" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="527" y="166" font-size="13.5" fill="var(--art-ink, #171717)" >· Anotar sobre el PDF</text><text x="527" y="200" font-size="13.5" fill="var(--art-ink, #171717)" >· Diffs PDF maquetados</text><text x="527" y="234" font-size="13.5" fill="var(--art-accent, #2563eb)" >· Sync vivo con Overleaf</text><path d="M134 316v26h492v-26" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4" stroke-dasharray="4 4" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="380" y="378" font-size="15" fill="var(--art-muted, #525252)" text-anchor="middle">Sincronización Overleaf (~1 s) web y PDF</text></g></svg>
