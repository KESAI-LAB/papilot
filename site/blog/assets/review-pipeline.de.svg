<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 448" role="img" aria-labelledby="title desc"><title id="title">Inkrementelle PDF-Diff-Pipeline</title><desc id="desc">Papilot isoliert KI-Edits im Git-Worktree, kompiliert geänderte Kapitel parallel und speichert widerrufbare Entscheidungen.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"/></marker></defs><g font-family="'Paper Serif','TeX Gyre Pagella',Palatino,'Songti SC','Noto Serif CJK SC',SimSun,serif"><text x="380" y="36" font-size="24" fill="var(--art-ink, #171717)" text-anchor="middle">Inkrementelle PDF-Diff-Pipeline</text><rect x="30" y="73" width="300" height="124" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="49" y="100" font-size="13.5" fill="var(--art-muted, #525252)" >01  /  Git-Worktree</text><text x="49" y="131" font-size="20.5" fill="var(--art-ink, #171717)" >Aufgabe isolieren</text><text x="49" y="162" font-size="15.5" fill="var(--art-muted, #525252)" >Privater Git-Snapshot-Index.</text><rect x="430" y="73" width="300" height="124" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="449" y="100" font-size="13.5" fill="var(--art-muted, #525252)" >02  /  Seed-Build</text><text x="449" y="131" font-size="20.5" fill="var(--art-ink, #171717)" >Klonen &amp; bauen</text><text x="449" y="162" font-size="15.5" fill="var(--art-muted, #525252)" >Kapitel parallel bauen.</text><rect x="30" y="273" width="300" height="124" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-accent, #2563eb)"/><text x="49" y="300" font-size="13.5" fill="var(--art-muted, #525252)" >03  /  Diff-Engine</text><text x="49" y="331" font-size="20.5" fill="var(--art-ink, #171717)" >Satz-Vergleich</text><text x="49" y="362" font-size="15.5" fill="var(--art-muted, #525252)" >Feiner Text &amp; ganze Formeln.</text><rect x="430" y="273" width="300" height="124" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-accent, #2563eb)"/><text x="449" y="300" font-size="13.5" fill="var(--art-muted, #525252)" >04  /  Prüfjournal</text><text x="449" y="331" font-size="20.5" fill="var(--art-ink, #171717)" >Pro Notiz wählen</text><text x="449" y="362" font-size="15.5" fill="var(--art-muted, #525252)" >Widerrufbar bis Anwenden.</text><path d="M344 135h72" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M580 209v26H180v24" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M344 335h72" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"  marker-end="url(#arrow)"/><text x="380" y="434" font-size="15.5" fill="var(--art-muted, #525252)" text-anchor="middle">Arbeitsordner bleibt bis Anwenden unberührt.</text></g></svg>
