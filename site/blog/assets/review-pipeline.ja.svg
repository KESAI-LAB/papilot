<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 448" role="img" aria-labelledby="title desc"><title id="title">差分コンパイルと組版確認の流れ</title><desc id="desc">PapilotがGitワークツリー内でタスクのスナップショットを取得し、ウォームなLaTeX状態から新旧両バージョンをビルドし、組版済みドキュメントを比較して各判断を記録する仕組み。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"/></marker></defs><g font-family="'Paper Serif','TeX Gyre Pagella',Palatino,'Songti SC','Noto Serif CJK SC',SimSun,serif"><text x="380" y="36" font-size="24" fill="var(--art-ink, #171717)" text-anchor="middle">差分コンパイルと組版確認の流れ</text><rect x="30" y="73" width="300" height="124" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="49" y="100" font-size="13.5" fill="var(--art-muted, #525252)" >01  /  Git ワークツリー</text><text x="49" y="131" font-size="20.5" fill="var(--art-ink, #171717)" >タスクを隔離</text><text x="49" y="162" font-size="15.5" fill="var(--art-muted, #525252)" >専用 Git 差分インデックス。</text><rect x="430" y="73" width="300" height="124" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="449" y="100" font-size="13.5" fill="var(--art-muted, #525252)" >02  /  シードビルド</text><text x="449" y="131" font-size="20.5" fill="var(--art-ink, #171717)" >複製と並列構築</text><text x="449" y="162" font-size="15.5" fill="var(--art-muted, #525252)" >ウォーム状態から新旧を同時ビルド。</text><rect x="30" y="273" width="300" height="124" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-accent, #2563eb)"/><text x="49" y="300" font-size="13.5" fill="var(--art-muted, #525252)" >03  /  差分エンジン</text><text x="49" y="331" font-size="20.5" fill="var(--art-ink, #171717)" >組版前後の比較</text><text x="49" y="362" font-size="15.5" fill="var(--art-muted, #525252)" >本文位置と数式の保護。</text><rect x="430" y="273" width="300" height="124" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-accent, #2563eb)"/><text x="449" y="300" font-size="13.5" fill="var(--art-muted, #525252)" >04  /  判断ジャーナル</text><text x="449" y="331" font-size="20.5" fill="var(--art-ink, #171717)" >注釈ごとに判断</text><text x="449" y="362" font-size="15.5" fill="var(--art-muted, #525252)" >適用するまで原稿を保護。</text><path d="M344 135h72" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M580 209v26H180v24" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M344 335h72" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"  marker-end="url(#arrow)"/><text x="380" y="434" font-size="15.5" fill="var(--art-muted, #525252)" text-anchor="middle">適用・コミットまで作業フォルダは不変。</text></g></svg>
