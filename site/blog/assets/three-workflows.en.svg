<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 416" role="img" aria-labelledby="title desc"><title id="title">Three LaTeX workflows, side by side</title><desc id="desc">Comparing Overleaf in the browser, a local source IDE with a coding agent, and Papilot on the compiled PDF with live Overleaf sync.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"/></marker></defs><g font-family="'Paper Serif','TeX Gyre Pagella',Palatino,'Songti SC','Noto Serif CJK SC',SimSun,serif"><text x="380" y="35" font-size="24" fill="var(--art-ink, #171717)" text-anchor="middle">Three LaTeX workflows, side by side</text><rect x="20" y="68" width="228" height="236" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="35" y="93" font-size="13" fill="var(--art-muted, #525252)" >01 / Browser</text><text x="35" y="121" font-size="18.5" fill="var(--art-ink, #171717)" >Overleaf</text><path d="M35 135h198" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="35" y="166" font-size="13.5" fill="var(--art-ink, #171717)" >· Split .tex &amp; PDF view</text><text x="35" y="200" font-size="13.5" fill="var(--art-ink, #171717)" >· Zero-setup coauthors</text><text x="35" y="234" font-size="13.5" fill="var(--art-muted, #525252)" >· Manual source review</text><rect x="266" y="68" width="228" height="236" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="281" y="93" font-size="13" fill="var(--art-muted, #525252)" >02 / Code IDE</text><text x="281" y="121" font-size="18.5" fill="var(--art-ink, #171717)" >IDE + Agent</text><path d="M281 135h198" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="281" y="166" font-size="13.5" fill="var(--art-ink, #171717)" >· Local Git &amp; CLI tools</text><text x="281" y="200" font-size="13.5" fill="var(--art-ink, #171717)" >· Prompt in .tex files</text><text x="281" y="234" font-size="13.5" fill="var(--art-muted, #525252)" >· Raw git diff patches</text><rect x="512" y="68" width="228" height="236" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-accent, #2563eb)"/><text x="527" y="93" font-size="13" fill="var(--art-muted, #525252)" >03 / PDF-first</text><text x="527" y="121" font-size="18.5" fill="var(--art-ink, #171717)" >Papilot</text><path d="M527 135h198" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="527" y="166" font-size="13.5" fill="var(--art-ink, #171717)" >· Annotate on the PDF</text><text x="527" y="200" font-size="13.5" fill="var(--art-ink, #171717)" >· Typeset PDF diff review</text><text x="527" y="234" font-size="13.5" fill="var(--art-accent, #2563eb)" >· Live Overleaf sync</text><path d="M134 316v26h492v-26" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4" stroke-dasharray="4 4" marker-start="url(#arrow)" marker-end="url(#arrow)"/><text x="380" y="378" font-size="15" fill="var(--art-muted, #525252)" text-anchor="middle">Live Overleaf sync (~1 s) links browser &amp; PDF</text></g></svg>
