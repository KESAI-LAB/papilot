<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 672" role="img" aria-labelledby="title desc"><title id="title">Tre flussi LaTeX a confronto</title><desc id="desc">Confronto tra Overleaf nel browser, un IDE locale con agente IA e Papilot centrato sul PDF con sincronia Overleaf.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"/></marker></defs><g font-family="'Paper Serif','TeX Gyre Pagella',Palatino,'Songti SC','Noto Serif CJK SC',SimSun,serif"><text x="200" y="35" font-size="20" fill="var(--art-ink, #171717)" text-anchor="middle">Tre flussi LaTeX a confronto</text><rect x="24" y="62" width="352" height="166" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="39" y="87" font-size="13" fill="var(--art-muted, #525252)" >01 / Browser</text><text x="39" y="115" font-size="19" fill="var(--art-ink, #171717)" >Overleaf</text><path d="M39 129h322" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="39" y="156" font-size="14.5" fill="var(--art-ink, #171717)" >· Vista divisa .tex e PDF</text><text x="39" y="183" font-size="14.5" fill="var(--art-ink, #171717)" >· Coautori zero setup</text><text x="39" y="210" font-size="14.5" fill="var(--art-muted, #525252)" >· Revisione codice .tex</text><rect x="24" y="246" width="352" height="166" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="39" y="271" font-size="13" fill="var(--art-muted, #525252)" >02 / IDE codice</text><text x="39" y="299" font-size="19" fill="var(--art-ink, #171717)" >IDE + Agente</text><path d="M39 313h322" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="39" y="340" font-size="14.5" fill="var(--art-ink, #171717)" >· Git locale e tool CLI</text><text x="39" y="367" font-size="14.5" fill="var(--art-ink, #171717)" >· Prompt nei file .tex</text><text x="39" y="394" font-size="14.5" fill="var(--art-muted, #525252)" >· Patch git diff grezze</text><rect x="24" y="430" width="352" height="166" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-accent, #2563eb)"/><text x="39" y="455" font-size="13" fill="var(--art-muted, #525252)" >03 / Prima il PDF</text><text x="39" y="483" font-size="19" fill="var(--art-ink, #171717)" >Papilot</text><path d="M39 497h322" fill="none" stroke="var(--art-line, #d6d6d6)"/><text x="39" y="524" font-size="14.5" fill="var(--art-ink, #171717)" >· Annota sul PDF</text><text x="39" y="551" font-size="14.5" fill="var(--art-ink, #171717)" >· Diff PDF impaginati</text><text x="39" y="578" font-size="14.5" fill="var(--art-accent, #2563eb)" >· Sync vivo con Overleaf</text><text x="200" y="644" font-size="14" fill="var(--art-muted, #525252)" text-anchor="middle">Sincronia Overleaf (~1 s) tra web e PDF</text></g></svg>
