<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 448" role="img" aria-labelledby="title desc"><title id="title">증분 조판 검토 파이프라인</title><desc id="desc">Papilot이 Git 워크트리에 태스크 스냅샷을 찍고, 웜 LaTeX 상태에서 두 버전을 빌드하며, 조판된 문서를 비교하고 각 결정을 기록하는 과정.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1 8 5 1 9" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"/></marker></defs><g font-family="'Paper Serif','TeX Gyre Pagella',Palatino,'Songti SC','Noto Serif CJK SC',SimSun,serif"><text x="380" y="36" font-size="24" fill="var(--art-ink, #171717)" text-anchor="middle">증분 조판 검토 파이프라인</text><rect x="30" y="73" width="300" height="124" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="49" y="100" font-size="13.5" fill="var(--art-muted, #525252)" >01  /  Git 워크트리</text><text x="49" y="131" font-size="20.5" fill="var(--art-ink, #171717)" >작업 수정 격리</text><text x="49" y="162" font-size="15.5" fill="var(--art-muted, #525252)" >전용 Git 증분 스냅샷 인덱스.</text><rect x="430" y="73" width="300" height="124" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-line, #d6d6d6)"/><text x="449" y="100" font-size="13.5" fill="var(--art-muted, #525252)" >02  /  시드 빌드</text><text x="449" y="131" font-size="20.5" fill="var(--art-ink, #171717)" >복제 및 컴파일</text><text x="449" y="162" font-size="15.5" fill="var(--art-muted, #525252)" >웜 상태, 양쪽 동시 빌드.</text><rect x="30" y="273" width="300" height="124" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-accent, #2563eb)"/><text x="49" y="300" font-size="13.5" fill="var(--art-muted, #525252)" >03  /  비교 엔진</text><text x="49" y="331" font-size="20.5" fill="var(--art-ink, #171717)" >조판 전후 비교</text><text x="49" y="362" font-size="15.5" fill="var(--art-muted, #525252)" >본문 오프셋과 수식 보존.</text><rect x="430" y="273" width="300" height="124" rx="2" fill="var(--art-paper, #fff)" stroke="var(--art-accent, #2563eb)"/><text x="449" y="300" font-size="13.5" fill="var(--art-muted, #525252)" >04  /  검토 저널</text><text x="449" y="331" font-size="20.5" fill="var(--art-ink, #171717)" >주석별 수락 결정</text><text x="449" y="362" font-size="15.5" fill="var(--art-muted, #525252)" >적용 전까지 원본을 보호.</text><path d="M344 135h72" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M580 209v26H180v24" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"  marker-end="url(#arrow)"/><path d="M344 335h72" fill="none" stroke="var(--art-accent, #2563eb)" stroke-width="1.4"  marker-end="url(#arrow)"/><text x="380" y="434" font-size="15.5" fill="var(--art-muted, #525252)" text-anchor="middle">적용·커밋 전까지 작업 폴더는 그대로 유지.</text></g></svg>
